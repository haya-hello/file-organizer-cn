name: Validate Skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate Skill package
        run: python tests/validate_skill.py
      - name: Verify public example contains no local path
        shell: bash
        run: |
          if grep -Fq 'D:\自媒体项目' examples/file-organizer-preview.html; then
            echo 'Public example leaked a local path'
            exit 1
          fi
          if grep -Fq '活动方案' examples/file-organizer-preview.html; then
            echo 'Public example leaked a demo filename in privacy mode'
            exit 1
          fi
